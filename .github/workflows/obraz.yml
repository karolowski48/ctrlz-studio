# Obraz strony (Astro + Caddy) w prywatnym rejestrze GitHuba (ghcr.io).
# Serwer pobiera go razem z panelem: docker compose pull && docker compose up -d (repo ctrlz-hub, deploy/).
name: Obraz strony

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: obraz
  cancel-in-progress: true

jobs:
  obraz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/karolowski48/ctrlz-studio-new:latest
            ghcr.io/karolowski48/ctrlz-studio-new:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
